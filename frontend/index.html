<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">

    <title>MUSTMAKE</title>
</head>
<body>
    <p>Opening MUSTMAKE… <a id="homeLink" href="/pages/gst.html">Continue</a></p>
    <script>
        let isAuthenticated = false;
        try {
            isAuthenticated = Boolean(
                localStorage.getItem("token") &&
                JSON.parse(localStorage.getItem("user") || "null")
            );
        } catch {
            isAuthenticated = false;
        }

        const destination = isAuthenticated ? "/pages/index.html" : "/pages/gst.html";
        document.getElementById("homeLink").href = destination;
        window.location.replace(destination);
    </script>
</body>
</html>
