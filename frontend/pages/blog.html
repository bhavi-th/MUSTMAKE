<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            const isAuthenticated = Boolean(
                localStorage.getItem("token") &&
                JSON.parse(localStorage.getItem("user") || "null")
            );
            if (isAuthenticated) window.location.replace("/today");
        } catch {
            // Invalid stored auth data is treated as a guest session.
        }
    </script>
    <script src="/js/core/change_backend_url.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">
    <title>Blog | MUSTMAKE</title>
    <script src="/js/shared/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .blog-hero {
            text-align: center;
            padding: 80px 0 60px;
            animation: fadeInUp 0.8s ease-out;
        }

        .blog-hero h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .blog-hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .blog-section {
            margin: 60px 0;
        }

        .blog-page .exercise-card,
        .blog-page .exercise-card:hover {
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            transform: none;
            transition: none;
        }

        .blog-page .exercise-card-media {
            background: transparent;
        }

        :root[data-theme="dark"] body.blog-page .exercise-card,
        :root[data-theme="dark"] body.blog-page .exercise-card:hover {
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            transform: none;
            transition: none;
        }

        :root[data-theme="dark"] body.blog-page .exercise-card-media {
            background: transparent;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        .cta-section {
            text-align: center;
            padding: 80px 0;
            background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 100%);
            border-radius: 20px;
            margin: 60px 0;
        }

        .cta-section h2 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .blog-hero {
                padding: 60px 0 40px;
            }

            .blog-hero h1 {
                font-size: 2rem;
            }

            .blog-hero p {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .blog-hero {
                animation: none;
            }
        }
    </style>
</head>
<body class="app-page blog-page">
    <div id="navbar"></div>

    <main class="container">
        <section class="blog-hero">
            <h1>Hardcome to MUSTMAKE</h1>
            <p>-you can and you must</p>
        </section>

        <section id="exercises" class="blog-section">
            <h2 class="section-title">what you do here</h2>
            <section class="exercise-library" aria-label="Exercise library">
                <div id="exerciseGrid" class="exercise-library-groups" aria-live="polite"></div>
            </section>
        </section>

        <section class="cta-section">
            <h2>Ready to become more stronger with MUSTMAKE?</h2>
            <a href="/signup" class="main-button">Get Started</a>
        </section>
    </main>

    <script src="/js/shared/navbar.js"></script>
    <script src="/js/features/exercises/exercise-library.js"></script>
</body>
</html>
