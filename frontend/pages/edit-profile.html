<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/core/change_backend_url.js"></script>
        <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">

    <title>Edit Profile | MUSTMAKE</title>
    <script src="/js/shared/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <div id="navbar"></div>

    <main class="profile-container">

        <section class="profile-card">

            <h1>Edit Profile</h1>

            <form id="profileForm">

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        min="0"
                        max="120"
                        step="1"
                        inputmode="numeric"
                        placeholder="Example: 28"
                    >
                    <small>We like to know your age for customized suggestions.</small>
                </div>

                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" min="50" max="300" placeholder="Example: 175">
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" min="20" max="500" step="0.1" placeholder="Example: 68">
                </div>

                <div class="form-group">
                    <label for="profilePicture">Profile Photo</label>
                    <div class="profile-upload">
                        <img id="photoPreview" src="" alt="Profile preview" class="profile-photo">
                        <input type="file" id="profilePicture" accept="image/jpeg,image/png,image/webp">
                    </div>
                    <small>JPG, PNG or WebP. Maximum 2 MB.</small>
                </div>

                <h2>Socials</h2>

                <div class="form-group social-links-field">
                    <label>Social Links</label>
                    <div id="social-links-container" class="social-links-container"></div>
                    <button type="button" id="add-social-link">+ Add Link</button>
                    <small id="social-links-count" aria-live="polite"></small>
                </div>

                <button type="submit" class="main-button">Save Profile</button>

            </form>

            <p id="profileMessage" class="auth-message"></p>

        </section>

    </main>

    <script src="/js/shared/navbar.js"></script>
    <script src="/js/features/profile/edit-profile.js"></script>

</body>

</html>
