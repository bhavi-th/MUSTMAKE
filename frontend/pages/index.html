<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            const isAuthenticated = Boolean(
                localStorage.getItem("token") &&
                JSON.parse(localStorage.getItem("user") || "null")
            );
            if (!isAuthenticated) window.location.replace("/pages/gst.html");
        } catch {
            window.location.replace("/pages/gst.html");
        }
    </script>
    <script src="/js/core/change_backend_url.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">
    <title>Today | MUSTMAKE</title>
    <script src="/js/shared/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="app-page">
    <div id="navbar"></div>

    <main class="container">
        <section id="guestCta" class="today-guest" hidden>
            <section class="hero">
                <h1>Today</h1>
                <p class="subtitle">Log in to see your workouts and daily streak.</p>
            </section>
            <p class="auth-footer"><a href="/login">Sign in</a> · <a href="/signup">Create account</a></p>
        </section>
<!-- //normal -->
        <section id="personalDashboard" hidden>
            <section class="hero">
                <h1 id="todayDate">...</h1>
            </section>

            <div class="person-top">
                <div>
                    <h2 id="userName">...</h2>
                </div>
                <div class="streak">
                    <strong id="userStreak">0</strong>
                    <small>day streak</small>
                </div>
            </div>

            <section class="workout-section">
                <h3>What you made today</h3>
                <div id="userWorkouts" class="workouts">Loading workouts...</div>
            </section>

          
        </section>
        <!-- //normal end  -->

    <main class="container exercise-library-page">
        <section class="exercise-library" aria-labelledby="exerciseLibraryTitle">
            <div id="exerciseGrid" class="exercise-library-groups" aria-live="polite"></div>
        </section>
    </main>

    </main>

    <script src="/js/shared/navbar.js"></script>
    <script src="/js/features/workouts/script.js"></script>
    <script src="/js/features/exercises/exercise-library.js"></script>
</body>
</html>
